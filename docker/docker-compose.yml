version: '3.8'
services:
  postgres-db:
    image: postgres:17-alpine
    container_name: postgres-db
    networks:
      - news-network
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=news_db
#    command: ["-p 5436"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d news_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  newsservice:
    image: newsservice:native
    container_name: newsservice-native
    networks:
      - news-network
    ports:
      - "8080:8080"
    environment:
      - APP_SERVER_PORT=8080
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=news_db
      - DB_SCHEMA=news_schema
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 5s
    depends_on:
      postgres-db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - news-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - news-network
    depends_on:
      - prometheus

networks:
  news-network:
    driver: bridge